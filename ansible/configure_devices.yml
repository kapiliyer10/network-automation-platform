---
- name: Run network automation workflow
  hosts: routers
  gather_facts: false
  serial: 1

  tasks:
    - name: Run Python automation workflow
      ansible.builtin.command:
        cmd: python -m scripts.run_device --device {{ inventory_hostname }}
        chdir: "{{ playbook_dir }}/.."
      register: device_workflow_result
      changed_when: false
      failed_when: false

    - name: Display Python workflow result
      ansible.builtin.debug:
        var: device_workflow_result.stdout

    - name: Fail when workflow reports drift or another error
      ansible.builtin.fail:
        msg: "Network automation workflow failed for {{ inventory_hostname }}"
      when: device_workflow_result.rc != 0
