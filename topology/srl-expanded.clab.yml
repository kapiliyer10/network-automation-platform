name: srl-expanded

topology:
  nodes:
    R1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      startup-config: ~/network-automation-platform/configs/srl-expanded/R1.cli

    R2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      startup-config: ~/network-automation-platform/configs/srl-expanded/R2.cli

    R3:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      startup-config: ~/network-automation-platform/configs/srl-expanded/R3.cli

    H1:
      kind: linux
      image: network-test-endpoint:1.0
      cmd: sleep infinity
      exec:
        - ip link set eth1 mtu 1500
        - ip link set eth1 up
        - ip address replace 10.0.14.2/30 dev eth1
        - ip route replace default via 10.0.14.1

    H2:
      kind: linux
      image: network-test-endpoint:1.0
      cmd: python3 -u /app/tcp_server.py
      exec:
        - ip link set eth1 mtu 1500
        - ip link set eth1 up
        - ip address replace 10.0.24.2/30 dev eth1
        - ip route replace default via 10.0.24.1
        - sh -c 'python3 -u /app/udp_server.py > /tmp/udp_server.log 2>&1 &'
        - iperf3 -s -B 10.0.24.2 -D

  links:
    - endpoints: ["R1:ethernet-1/1", "R2:ethernet-1/1"]
    - endpoints: ["R2:ethernet-1/2", "R3:ethernet-1/1"]
    - endpoints: ["R3:ethernet-1/2", "R1:ethernet-1/2"]
    - endpoints: ["R1:ethernet-1/3", "H1:eth1"]
    - endpoints: ["R2:ethernet-1/3", "H2:eth1"]
