devices:
  R1:
    interfaces:
      ethernet-1/1:
        admin_state: enable
        ipv4:
          admin_state: enable
          address: 10.0.12.1/30
      ethernet-1/2:
        admin_state: enable
        ipv4:
          admin_state: enable
          address: 10.0.31.1/30

    network_instances:
      default:
        interfaces:
          - ethernet-1/1.0
          - ethernet-1/2.0
          - lo0.0

    ospf:
      instance:
        name: default
        admin_state: enable
        version: ospf-v2
        router_id: 1.1.1.1
        areas:
          0.0.0.0:
            interfaces:
              ethernet-1/1.0: {}
              ethernet-1/2.0: {}

    bgp:
      autonomous_system: 65001
      router_id: 1.1.1.1
      afi_safi:
        ipv4_unicast:
          admin_state: enable
      peer_groups:
        to-r2:
          peer_as: 65002
        to-r3:
          peer_as: 65003
      neighbors:
        10.0.12.2:
          peer_group: to-r2
        10.0.31.2:
          peer_group: to-r3
      import_policy: allow-bgp-loopbacks
      export_policy: allow-bgp-loopbacks

  R2:
    interfaces:
      ethernet-1/1:
        admin_state: enable
        ipv4:
          admin_state: enable
          address: 10.0.12.2/30
      ethernet-1/2:
        admin_state: enable
        ipv4:
          admin_state: enable
          address: 10.0.23.1/30

    network_instances:
      default:
        interfaces:
          - ethernet-1/1.0
          - ethernet-1/2.0
          - lo0.0

    ospf:
      instance:
        name: default
        admin_state: enable
        version: ospf-v2
        router_id: 2.2.2.2
        areas:
          0.0.0.0:
            interfaces:
              ethernet-1/1.0: {}
              ethernet-1/2.0: {}

    bgp:
      autonomous_system: 65002
      router_id: 2.2.2.2
      afi_safi:
        ipv4_unicast:
          admin_state: enable
      peer_groups:
        to-r1:
          peer_as: 65001
        to-r3:
          peer_as: 65003
      neighbors:
        10.0.12.1:
          peer_group: to-r1
        10.0.23.2:
          peer_group: to-r3
      import_policy: allow-bgp-loopbacks
      export_policy: allow-bgp-loopbacks

  R3:
    interfaces:
      ethernet-1/1:
        admin_state: enable
        ipv4:
          admin_state: enable
          address: 10.0.23.2/30
      ethernet-1/2:
        admin_state: enable
        ipv4:
          admin_state: enable
          address: 10.0.31.2/30

    network_instances:
      default:
        interfaces:
          - ethernet-1/1.0
          - ethernet-1/2.0
          - lo0.0

    ospf:
      instance:
        name: default
        admin_state: enable
        version: ospf-v2
        router_id: 3.3.3.3
        areas:
          0.0.0.0:
            interfaces:
              ethernet-1/1.0: {}
              ethernet-1/2.0: {}

    bgp:
      autonomous_system: 65003
      router_id: 3.3.3.3
      afi_safi:
        ipv4_unicast:
          admin_state: enable
      peer_groups:
        to-r1:
          peer_as: 65001
        to-r2:
          peer_as: 65002
      neighbors:
        10.0.31.1:
          peer_group: to-r1
        10.0.23.1:
          peer_group: to-r2
      import_policy: allow-bgp-loopbacks
      export_policy: allow-bgp-loopbacks

routing_policies:
  prefix_sets:
    bgp-loopbacks:
      prefixes:
        - prefix: 10.255.0.1/32
          mask_length_range: exact
        - prefix: 10.255.0.2/32
          mask_length_range: exact
        - prefix: 10.255.0.3/32
          mask_length_range: exact

  policies:
    allow-bgp-loopbacks:
      default_action: reject
      statements:
        - sequence: 10
          match:
            prefix_set: bgp-loopbacks
            match_set_options: any
          action: accept
